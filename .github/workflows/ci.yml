name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run prek hooks
        run: uv run prek run --all-files
      - name: Check rendered values and assets are current
        run: uv run workshopify check

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Generate notebooks
        run: uv run workshopify generate
      - name: Execute notebook 01
        run: uv run jupyter execute notebooks/completed/01_reading-cogs-the-hard-way.ipynb
      - name: Execute notebook 02
        run: uv run jupyter execute notebooks/completed/02_reading-zarr-the-hard-way.ipynb
      - name: Execute notebook 03
        run: uv run jupyter execute notebooks/completed/03_free-range-artisanal-grass-fed-kerchunk.ipynb
