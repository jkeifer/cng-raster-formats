[project]
name = "cng-raster-formats"
version = "0.1.0"
description = "Exploring Cloud-Native Geospatial Formats: A Hands-on Workshop for Raster Data"
readme = "README.md"
authors = [
    { name = "Jarrett Keifer", email = "jkeifer0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.1",
    "folium>=0.20.0",
    "fsspec>=2025.9.0",
    "griffine>=0.1.0",
    "icechunk>=2.1.0",
    "jupyterlab>=4.4.6",
    "numcodecs>=0.16.3",
    "numpy>=2.3.4",
    "obspec-utils>=0.9.0",
    "obstore>=0.11.0",
    "odc-geo>=0.4.10",
    "pystac-client>=0.9.0",
    "virtualizarr>=2.7.0",
    "xarray>=2025.10.1",
    "zarr>=3.1.3",
]

[project.urls]
Repository = 'https://github.com/jkeifer/cng-raster-formats'

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipynb-scrubber>=0.4.1",
    "jupytext>=1.19.4",
    "prek>=0.4.8",
    "ruff>=0.15.20",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# The notebook sources deliberately import modules mid-file, where the
# narrative introduces them. They also end cells with a bare expression, which
# is how a notebook displays a value, not a mistake.
"src/*.py" = ["E402", "B018"]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.jupytext]
# The py:percent files in src/ are the source of truth, named for their
# exercises (e.g. src/01_reading-cogs-the-hard-way.py). They sync out to the
# completed notebooks in notebooks/completed/ (which are, in turn, scrubbed
# into the exercise notebooks in notebooks/). The .py files give clean,
# reviewable diffs in version control; everything under notebooks/ is
# generated.
#
# Workflow:
#   1. Edit src/NN_<name>.py (or the notebook in Jupyter).
#   2. `uv run jupytext --sync src/*.py` to sync the pair.
#   3. `uv run scripts/generate_notebooks.py` to regenerate the exercise
#      notebooks + notes from the completed notebooks.
#
# Only the completed notebooks (notebooks/completed/) are paired; the
# generated exercise notebooks are build artifacts of the scrubber.

# Pair .py source files in src/ with completed notebooks in notebooks/completed/.
formats = "src///py:percent,notebooks/completed///ipynb"

# Keep outputs out of the .py (they live only in the .ipynb).
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[tool.ipynb-scrubber.options]
clear-text = ""

[[tool.ipynb-scrubber.files]]
input = "notebooks/completed/01_reading-cogs-the-hard-way.ipynb"
output = "notebooks/01_reading-cogs-the-hard-way.ipynb"
notes-file = "notes/01_reading-cogs-the-hard-way.md"

[[tool.ipynb-scrubber.files]]
input = "notebooks/completed/02_reading-zarr-the-hard-way.ipynb"
output = "notebooks/02_reading-zarr-the-hard-way.ipynb"
notes-file = "notes/02_reading-zarr-the-hard-way.md"

[[tool.ipynb-scrubber.files]]
input = "notebooks/completed/03_free-range-artisanal-grass-fed-kerchunk.ipynb"
output = "notebooks/03_free-range-artisanal-grass-fed-kerchunk.ipynb"
